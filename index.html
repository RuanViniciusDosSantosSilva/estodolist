<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>EsToDoList</title>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">
    <header class="bg-indigo-600 text-white">
        <div class="max-w-5x1 mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold">EsToDoList</h1>
            <p class="hidden text-sm md:inline">Organize sua rotina escolar</p>
        </div>
    </header>
    <main>

        <!-- Coluna 1: Criar, pesquisa e filtrar -->
         <section>
            <form>
                <input type="text" placeholder="Nova Tarefa">
                <input type="date">
                <button>Adicionar</button>
            </form>
            <input type="text" placeholder="Pesquisar tarefa...">
            <div>
                <button>Todas</button>
                <button>Pendentes</button>
                <button>Concluídas</button>
            </div>
         </section>
        <!-- Coluna 2: lista de tarefas -->
         <section>
            <ul>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>
                            <span>Trabalho de História</span>
                            <span>20/10/2026</span>
                        </span>
                    </label>
                    <div>
                        <button>Editar</button>
                        <button>Excluir</button>
                    </div>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>
                            <span>Estudar para a prova de Física</span>
                            <span>22/10/2026</span>
                        </span>
                    </label>
                    <div>
                        <button>Editar</button>
                        <button>Excluir</button>
                    </div>
                </li>
                <li>
                    <label>
                        <input type="checkbox">
                        <span>
                            <span>Apresentação de Geografia</span>
                            <span>15/10/2026</span>
                        </span>
                    </label>
                    <div>
                        <button>Editar</button>
                        <button>Excluir</button>
                    </div>
                </li>
            </ul>
            <p>2 Tarefas Pendentes</p>
         </section>

    </main>
    <footer>



    </footer>
</body>

</html>
